<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test de vitesse</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">

  <!-- ======= Blurred intro prompt ======= -->
  <div id="promptOverlay">
    <div id="promptBox">
      <div id="promptTitle">made by taha 7way simo</div>
      <p id="promptText">kteb speed li bghiti</p>
      <div class="promptRow">
        <input type="number" id="speedInput" placeholder="0" min="0.1" max="99999" step="0.1">
        <select id="unitSelect">
          <option value="Kbps">Kbps</option>
          <option value="Mbps" selected>Mbps</option>
          <option value="Gbps">Gbps</option>
        </select>
        <button id="promptBtn">GO</button>
      </div>
      <div id="promptHint">bdel l'unit&eacute; men Kbps / Mbps / Gbps</div>
    </div>
  </div>

  <!-- ======= Page ======= -->
  <div id="page">

    <header class="topbar">
      <nav class="topnav">
        <span class="navItem">Fran&ccedil;ais (France)
          <svg class="caret" viewBox="0 0 12 8" width="10" height="7"><path d="M1 1.5 L6 6.5 L11 1.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <a class="navItem" href="#">Confidentialit&eacute;</a>
      </nav>
    </header>

    <main class="main">

      <!-- Logo: drop your own image file next to index.html as logo.png -->
      <div class="brand">
        <img id="logoImg" class="logoImg" src="logo.png" alt=""
             onerror="this.classList.add('missing');this.removeAttribute('src');">
      </div>

      <h1 id="statusText">Votre vitesse de connexion est de</h1>

      <!-- Speed readout -->
      <div class="readout">
        <div id="speedValue" class="testing">0</div>
        <div class="readoutSide">
          <div id="speedUnit" class="testing">Mbps</div>
          <button id="refreshBtn" type="button" aria-label="Refaire le test">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 11a8 8 0 1 0-1.6 5.4"/>
              <polyline points="20 4 20 11 13 11"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- More info -->
      <button id="moreBtn" type="button">Voir plus d'infos</button>

      <div id="moreInfo">
        <div class="infoGrid">
          <div class="infoItem">
            <div class="infoLabel">T&Eacute;L&Eacute;CHARGEMENT</div>
            <div class="infoValue"><span id="downVal">0</span><span class="infoUnit down-unit">Mbps</span></div>
          </div>
          <div class="infoItem">
            <div class="infoLabel">ENVOI</div>
            <div class="infoValue"><span id="upVal">0</span><span class="infoUnit up-unit">Mbps</span></div>
          </div>
          <div class="infoItem">
            <div class="infoLabel">LATENCE NON CHARG&Eacute;E</div>
            <div class="infoValue"><span id="pingVal">0</span><span class="infoUnit">ms</span></div>
          </div>
          <div class="infoItem">
            <div class="infoLabel">LATENCE CHARG&Eacute;E</div>
            <div class="infoValue"><span id="loadedPingVal">0</span><span class="infoUnit">ms</span></div>
          </div>
        </div>
      </div>

      <!-- Social row -->
      <div class="socialRow">
        <a class="socialIcon" href="#" aria-label="Aide"><span class="qmark">?</span></a>
        <a class="socialIcon" href="#" aria-label="Partager">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="#fff"><path d="M13.5 21v-8h2.7l.4-3.2h-3.1V7.7c0-.9.26-1.55 1.57-1.55H16.7V3.3A21 21 0 0 0 14.27 3.2c-2.4 0-4.05 1.47-4.05 4.17v2.43H7.5V13h2.72v8z"/></svg>
        </a>
        <a class="socialIcon" href="#" aria-label="Partager">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="#fff"><path d="M22 5.9a8 8 0 0 1-2.3.64 4 4 0 0 0 1.76-2.22 8 8 0 0 1-2.54.97 4 4 0 0 0-6.82 3.65A11.35 11.35 0 0 1 3.86 4.7a4 4 0 0 0 1.24 5.34 4 4 0 0 1-1.81-.5v.05a4 4 0 0 0 3.2 3.92 4 4 0 0 1-1.8.07 4 4 0 0 0 3.73 2.78A8 8 0 0 1 2.9 18.1a11.3 11.3 0 0 0 6.12 1.8c7.35 0 11.37-6.09 11.37-11.37l-.01-.52A8.1 8.1 0 0 0 22 5.9z"/></svg>
        </a>
      </div>

    </main>

    <footer class="footer">
      <div class="poweredBy">
        <span class="pbText">POWERED BY</span>
        <span class="pbBrand" id="pbBrand">TAHA &amp; SIMO</span>
      </div>
    </footer>

  </div>

<script src="script.js"></script>
</body>
</html>
